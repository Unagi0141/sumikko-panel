<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>画像</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1114;
        overflow: hidden;
        cursor: zoom-out;
        user-select: none;
      }
      #wrap {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      img {
        max-width: 100%;
        max-height: 100%;
        display: block;
      }
      #msg {
        color: #8d97a6;
        font: 14px/1.6 "Yu Gothic UI", system-ui, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        color: #9aa4b4;
        background: rgba(15, 17, 20, 0.82);
        border: 1px solid #262d38;
        border-radius: 999px;
        padding: 5px 14px;
        font: 12px "Yu Gothic UI", system-ui, sans-serif;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.4s;
      }
      #hint.gone {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="msg">読み込んでいます…</div></div>
    <div id="hint">クリック / Esc で閉じる</div>

    <script>
      const wrap = document.getElementById('wrap');
      const hint = document.getElementById('hint');
      let hintTimer = null;

      function show({ src }) {
        wrap.replaceChildren(Object.assign(document.createElement('div'), {
          id: 'msg',
          textContent: '読み込んでいます…',
        }));

        const img = new Image();
        img.onload = () => {
          wrap.replaceChildren(img);
          window.viewer.ready(img.naturalWidth, img.naturalHeight);
        };
        img.onerror = () => {
          const msg = document.createElement('div');
          msg.id = 'msg';
          msg.textContent = 'この画像は開けませんでした。';
          wrap.replaceChildren(msg);
          window.viewer.failed();
        };
        img.src = src;

        // 案内は数秒で消す。毎回出ていると鬱陶しいため。
        hint.classList.remove('gone');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hint.classList.add('gone'), 2600);
      }

      window.viewer.onShow(show);
      addEventListener('click', () => window.viewer.close());
      addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter') window.viewer.close();
      });
    </script>
  </body>
</html>
