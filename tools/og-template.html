<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>OG 画像のもと</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap"
    />
    <style>
      /* 配色は配布ページからそのまま持ってきている。別物に見えないように。 */
      :root {
        --ground: #f3f5f9;
        --surface: #ffffff;
        --sunk: #e8ecf3;
        --ink: #131722;
        --ink-soft: #454e60;
        --muted: #6b7486;
        --line: #d9dfea;
        --accent: #1e4fc4;
        --dock: #0f1114;
        --dock-raised: #171b21;
        --dock-line: #262d38;
        --dock-col-a: #60a5fa;
        --dock-col-b: #94a3b8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        background: var(--ground);
        font-family: "BIZ UDPGothic", sans-serif;
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 72px;
        overflow: hidden;
      }

      .left {
        width: 646px;
        flex: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "Zen Kaku Gothic New", sans-serif;
        font-weight: 900;
        font-size: 34px;
        letter-spacing: 0.01em;
      }

      /* ロゴは配布ページと同じく CSS で描く */
      .mark {
        width: 52px;
        height: 52px;
        flex: none;
        display: flex;
        gap: 4px;
        padding: 6px;
        background: var(--dock);
        border-radius: 12px;
      }
      .mark i {
        flex: 1;
        border-radius: 4px;
      }
      .mark i:first-child {
        background: var(--dock-col-a);
      }
      .mark i:last-child {
        background: var(--dock-col-b);
      }

      h1 {
        margin-top: 34px;
        font-family: "Zen Kaku Gothic New", sans-serif;
        font-weight: 900;
        font-size: 60px;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      .sub {
        margin-top: 24px;
        font-size: 25px;
        line-height: 1.7;
        color: var(--ink-soft);
      }

      .tags {
        margin-top: 34px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 19px;
      }
      .tag {
        padding: 9px 18px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .tag.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      /* 右側は配布ページのドック図の縮小版 */
      .shot {
        flex: 1;
        height: 396px;
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: 0 30px 60px -30px rgba(19, 23, 34, 0.4);
        display: flex;
        overflow: hidden;
      }

      .win {
        flex: 1;
        padding: 20px;
      }
      .bar {
        display: flex;
        gap: 7px;
        margin-bottom: 18px;
      }
      .bar span {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--line);
      }
      .row {
        height: 13px;
        border-radius: 4px;
        background: var(--sunk);
        margin-bottom: 11px;
      }
      .row:nth-child(3) {
        width: 86%;
      }
      .row:nth-child(5) {
        width: 62%;
      }
      .row:nth-child(7) {
        width: 74%;
      }

      .dock {
        width: 150px;
        flex: none;
        background: var(--dock);
        border-left: 2px dashed var(--dock-col-a);
        display: flex;
        gap: 8px;
        padding: 14px;
      }
      .col {
        flex: 1;
        background: var(--dock-raised);
        border: 1px solid var(--dock-line);
        border-radius: 8px;
        padding: 10px 8px;
      }
      .post {
        height: 8px;
        border-radius: 3px;
        background: var(--dock-line);
        margin-bottom: 8px;
      }
      .post.a {
        background: #2b3644;
      }
      .post:nth-child(3) {
        width: 70%;
      }
      .post:nth-child(6) {
        width: 84%;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="brand">
        <span class="mark"><i></i><i></i></span>
        <span>すみっこパネル</span>
      </div>

      <h1>画面の端を、ちゃんと<br />空けてくれる。</h1>

      <p class="sub">
        好きな Web ページを画面の端に置きっぱなし。<br />
        最大化しても、じゃまされません。
      </p>

      <div class="tags">
        <span class="tag on">無料</span>
        <span class="tag">Windows 10 / 11</span>
      </div>
    </div>

    <div class="shot">
      <div class="win">
        <div class="bar"><span></span><span></span><span></span></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
      </div>
      <div class="dock">
        <div class="col">
          <div class="post a"></div>
          <div class="post"></div>
          <div class="post"></div>
          <div class="post a"></div>
          <div class="post"></div>
          <div class="post"></div>
        </div>
        <div class="col">
          <div class="post a"></div>
          <div class="post"></div>
          <div class="post"></div>
          <div class="post a"></div>
          <div class="post"></div>
          <div class="post"></div>
        </div>
      </div>
    </div>
  </body>
</html>
